<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background App Canvas -->
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Back Card Layer -->
  <rect x="120" y="88" width="272" height="320" rx="24" fill="#27272a" opacity="0.5" transform="rotate(8 256 248)"/>

  <!-- Main Flashcard Layer -->
  <rect x="110" y="96" width="292" height="320" rx="24" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="3"/>

  <!-- Card Top Header Bar -->
  <rect x="142" y="132" width="76" height="24" rx="12" fill="#27272a"/>
  <text x="180" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" text-anchor="middle" dominant-baseline="central">AP 午前</text>

  <!-- AP Monogram -->
  <text x="256" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#fafafa" text-anchor="middle" dominant-baseline="central">AP</text>

  <!-- Subtitle -->
  <text x="256" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#71717a" text-anchor="middle" dominant-baseline="central">FLASHPASS</text>

  <!-- Bottom Accent Indicator Dot -->
  <circle cx="256" cy="350" r="6" fill="url(#accentGrad)"/>
</svg>
